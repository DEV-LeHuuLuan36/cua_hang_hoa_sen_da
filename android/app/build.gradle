plugins {
    id "com.android.application"
    // START: FlutterFire Configuration
    id 'com.google.gms.google-services'
    // END: FlutterFire Configuration
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.cua_hang_hoa_sen_da"
    // Nâng lên 35 để thỏa mãn yêu cầu của các plugin mới
    compileSdk 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // Đồng bộ với Java 21 của hệ thống
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
        coreLibraryDesugaringEnabled true
    }

    kotlinOptions {
        // Kotlin cũng cần nhắm tới JVM 21 hoặc ít nhất là 17
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.example.cua_hang_hoa_sen_da"
        minSdk = 23
        targetSdk = 35 // Phải khớp với compileSdk để tối ưu hóa
        versionCode = flutter.versionCode
        versionName = flutter.versionName
    }

    buildTypes {
        release {
            signingConfig = signingConfigs.debug
        }
    }
}

flutter {
    source = "../.."
}

dependencies {
    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.0.4'
}